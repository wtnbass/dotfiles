[settings]
npm.package_manager = "pnpm"
# プロジェクトの .node-version / .nvmrc / rust-toolchain.toml に従う
idiomatic_version_file_enable_tools = ["node", "rust"]

[env]
# ~/.gitconfig の insteadOf で GitHub の URL が SSH になり、cargo 内蔵の git では認証できない
CARGO_NET_GIT_FETCH_WITH_CLI = "true"

[tools]
node = "lts"
pnpm = "latest"
python = "3.14"
rust = "stable"
# mise bootstrap がサードパーティ tap の cask 定義を読むのに Ruby 3 以上が要る
ruby = "latest"
# ~/.gitconfig の insteadOf で SSH になるので、cargo 内蔵の git ではなく git コマンドで取得する
"cargo:https://github.com/wtnbass/miel" = { version = "branch:main", install_env = { CARGO_NET_GIT_FETCH_WITH_CLI = "true" } }
"npm:@agentclientprotocol/claude-agent-acp" = "latest"
"npm:@iwe-org/iwe" = "latest"
"npm:@microsoft/compose-language-service" = "latest"
"npm:bash-language-server" = "latest"
"npm:dockerfile-language-server-nodejs" = "latest"
"npm:intelephense" = "latest"
"npm:oxfmt" = "latest"
"npm:oxlint" = "latest"
"npm:svgo" = "latest"
"npm:tombi" = "latest"
"npm:typescript" = "latest"
"npm:vercel" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"
