[language-server.tsc]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[language-server.iwe]
command = "iwes"

[[language]]
name = "typescript"
language-servers = ["tsc", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

[[language]]
name = "tsx"
language-servers = ["tsc", "oxlint"]
auto-format = true
formatter = { command = "oxfmt", args = ["--stdin-filepath", "%{buffer_name}"] }

